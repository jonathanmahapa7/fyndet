name: FyndEt integration checks
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bin/**'
      - 'database/**'
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
jobs:
  app-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fyndet_test
          MYSQL_ROOT_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, dom, gd, zip
          coverage: none
      - name: Create nonproduction test configuration
        run: |
          cp .env.example .env
          cat >> .env <<'CONFIG'
          APP_ENV=testing
          APP_URL=http://127.0.0.1:8099
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=fyndet_test
          DB_USER=root
          DB_PASS=testpass
          APP_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MAIL_FROM=test@fyndet.test
          STRIPE_WEBHOOK_SECRET=whsec_test_secret
          STRIPE_PRICE_PRO=price_integration_pro
          STRIPE_PRICE_BUSINESS=price_integration_business
          CONFIG
          mkdir -p var
          chmod 700 var
      - name: Install PDF rendering dependencies
        run: composer install --no-dev --prefer-dist --no-interaction
      - name: Apply cPanel migration runner
        run: |
          php bin/migrate-cpanel.php --check
          php bin/migrate-cpanel.php --apply
          php bin/migrate-cpanel.php --apply
      - name: Start local PHP server
        run: |
          php -S 127.0.0.1:8099 -t public public/router.php >/tmp/fyndet-integration-server.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8099/ >/dev/null
      - name: Exercise registration, verification, investigation, reports and recovery
        run: php tests/integration.php
      - name: Browser install for authenticated responsive review
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Process queued member reports
        run: php bin/process-investigations.php
      - name: Verify authenticated mobile and desktop screens
        run: node tests/visual-auth.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fyndet-authenticated-design-review
          path: design/qa/authenticated/*.png
          retention-days: 14
      - name: Print server diagnostics on failure
        if: failure()
        run: |
          tail -n 80 /tmp/fyndet-integration-server.log || true
