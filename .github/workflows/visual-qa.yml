name: FyndEt visual quality
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start public PHP routes
        run: |
          php -S 127.0.0.1:8099 -t public public/router.php >/tmp/fyndet-preview.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8099/ >/dev/null
          curl --fail http://127.0.0.1:8099/pricing >/dev/null
      - name: Assert readable responsive pages and capture screenshots
        run: node tests/visual.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fyndet-design-review
          path: design/qa/*.png
          retention-days: 14
